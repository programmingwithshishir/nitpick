# Spring Boot Application Configuration
spring.application.name=venue-booking

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/venue_booking
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Flyware Configuration
# Reset Flyware tracking on each startup, causing migrations to re-apply
# This effectively resets the database schema every time the application runs
spring.flyway.reset-on-migration=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=public
spring.flyway.enabled=true

# JPA/Hibernate Configuration
# Since Flyware manages the schema, we set hibernate to none
# The migration file includes DROP TABLE IF EXISTS for clean reset
spring.jpa.hibernate.ddl-auto=none

# SQL initialization mode (for spring.sql.init)
spring.sql.init.mode=always

# Logging
spring.sql.init.log-location=org.springframework.boot.jdbc

# Server
server.port=8080

# MySQL specific
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8InnoDBDialect

# Show SQL statements in logs (helpful for debugging)
spring.jpa.show-sql=true